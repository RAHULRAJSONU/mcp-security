<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{font-size:15px;fill:#0f172a;font-weight:600}
      .s{font-size:12.5px;fill:#475569}
      .h{font-size:20px;font-weight:700;fill:#0f172a}
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .app{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
      .sec{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
      .db{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .bd{fill:#d97706}
      .bn{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="44" class="h">mcp-security: architecture and trust boundaries</text>

  <rect x="40" y="290" width="150" height="80" rx="10" class="box"/>
  <text x="115" y="325" class="t" text-anchor="middle">AI agent</text>
  <text x="115" y="345" class="s" text-anchor="middle">MCP client</text>
  <rect x="230" y="290" width="160" height="80" rx="10" class="box"/>
  <text x="310" y="320" class="t" text-anchor="middle">Ingress / gateway</text>
  <text x="310" y="340" class="s" text-anchor="middle">TLS / mTLS · rate limit</text>
  <text x="310" y="356" class="s" text-anchor="middle">WAF · outside this repo</text>
  <path d="M190 330H228" class="ln" marker-end="url(#a)"/>
  <text x="115" y="272" class="s" text-anchor="middle">Token + DPoP / client cert</text>

  <rect x="40" y="560" width="150" height="70" rx="10" class="box"/>
  <text x="115" y="587" class="t" text-anchor="middle">Orchestrator</text>
  <text x="115" y="605" class="s" text-anchor="middle">+ Prometheus</text>
  <text x="115" y="620" class="s" text-anchor="middle">health · metrics</text>
  <path d="M190 595H438" class="ln" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="314" y="586" class="s" text-anchor="middle">:8081 management port</text>
  <text x="310" y="390" class="s" text-anchor="middle">public port :8080</text>

  <rect x="440" y="70" width="410" height="640" rx="14" fill="#f8fbff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="460" y="100" class="t">mcp-security (Spring Boot, stateless)</text>

  <rect x="470" y="130" width="350" height="56" rx="8" class="sec"/>
  <text x="645" y="154" class="t" text-anchor="middle">Security filter chain · optional mTLS</text>
  <text x="645" y="173" class="s" text-anchor="middle">JWT · DPoP or cert-bound tokens · deny by default</text>

  <rect x="470" y="210" width="350" height="56" rx="8" class="app"/>
  <text x="645" y="234" class="t" text-anchor="middle">MCP endpoint /mcp</text>
  <text x="645" y="253" class="s" text-anchor="middle">6 tools: summary · roster · meds · notes · audit</text>

  <rect x="470" y="290" width="350" height="56" rx="8" class="app"/>
  <text x="645" y="314" class="t" text-anchor="middle">ClinicalPrincipalResolver</text>
  <text x="645" y="333" class="s" text-anchor="middle">subject · tenant_id · scopes from the token</text>

  <rect x="470" y="370" width="350" height="56" rx="8" class="app"/>
  <text x="645" y="394" class="t" text-anchor="middle">SecuredPatientQueryService</text>
  <text x="645" y="413" class="s" text-anchor="middle">orchestrates the call · emits audit event</text>

  <rect x="470" y="450" width="350" height="56" rx="8" class="sec"/>
  <text x="645" y="474" class="t" text-anchor="middle">TenantScopedExecutor</text>
  <text x="645" y="493" class="s" text-anchor="middle">new txn · set_config('app.tenant_id', …, true)</text>

  <rect x="470" y="530" width="350" height="56" rx="8" class="sec"/>
  <text x="645" y="554" class="t" text-anchor="middle">PatientAccessPolicy</text>
  <text x="645" y="573" class="s" text-anchor="middle">treatment: assignment · emergency: break-glass</text>

  <rect x="470" y="610" width="350" height="56" rx="8" class="app"/>
  <text x="645" y="634" class="t" text-anchor="middle">JPA repositories</text>
  <text x="645" y="653" class="s" text-anchor="middle">reads · append-only audit writes</text>

  <g class="ln" marker-end="url(#a)">
    <path d="M645 186V208"/><path d="M645 266V288"/><path d="M645 346V368"/>
    <path d="M645 426V448"/><path d="M645 506V528"/><path d="M645 586V608"/>
  </g>
  <path d="M390 330H415V158H468" class="ln" marker-end="url(#a)"/>

  <rect x="930" y="110" width="230" height="80" rx="10" class="box"/>
  <text x="1045" y="142" class="t" text-anchor="middle">OIDC provider</text>
  <text x="1045" y="162" class="s" text-anchor="middle">discovery + signing keys (JWKS)</text>
  <text x="1045" y="178" class="s" text-anchor="middle">checked at startup (fail fast)</text>
  <path d="M820 158L928 150" class="ln" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <rect x="930" y="370" width="230" height="84" rx="10" class="box"/>
  <text x="1045" y="396" class="t" text-anchor="middle">Audit trail + counter</text>
  <text x="1045" y="416" class="s" text-anchor="middle">AUDIT.patient-access → log platform</text>
  <text x="1045" y="434" class="s" text-anchor="middle">append-only access_events table</text>
  <path d="M820 398L928 405" class="ln" marker-end="url(#a)"/>
  <path d="M1045 456V556" class="ln" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="1053" y="512" class="s">stored in the database</text>

  <rect x="930" y="560" width="230" height="130" rx="10" class="db"/>
  <text x="1045" y="590" class="t" text-anchor="middle">PostgreSQL</text>
  <text x="1045" y="612" class="s" text-anchor="middle">row-level security (forced)</text>
  <text x="1045" y="630" class="s" text-anchor="middle">app role: SELECT; INSERT on audit only</text>
  <text x="1045" y="648" class="s" text-anchor="middle">tenant policy on both tables</text>
  <path d="M820 638L928 625" class="ln" marker-end="url(#a)"/>
  <text x="858" y="662" class="s">SQL / TLS</text>

  <rect x="930" y="725" width="230" height="52" rx="10" class="box"/>
  <text x="1045" y="748" class="t" text-anchor="middle">Flyway migrations</text>
  <text x="1045" y="766" class="s" text-anchor="middle">separate owner role, not the app role</text>
  <path d="M1045 725V692" class="ln" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <circle cx="470" cy="130" r="11" class="bd"/><text x="470" y="134.5" class="bn">1</text>
  <circle cx="470" cy="530" r="11" class="bd"/><text x="470" y="534.5" class="bn">2</text>
  <circle cx="470" cy="450" r="11" class="bd"/><text x="470" y="454.5" class="bn">3</text>
  <circle cx="930" cy="560" r="11" class="bd"/><text x="930" y="564.5" class="bn">3</text>
  <circle cx="930" cy="370" r="11" class="bd"/><text x="930" y="374.5" class="bn">4</text>

  <rect x="40" y="672" width="360" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="696" class="t">Security layers</text>
  <text x="56" y="716" class="s">1  Prove who is calling (JWT, DPoP / mTLS)</text>
  <text x="56" y="734" class="s">2  Decide what they may do (policy)</text>
  <text x="56" y="752" class="s">3  Database enforces tenant isolation (RLS)</text>
  <text x="56" y="770" class="s">4  Leave an audit trail</text>
</svg>
